{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body text-center">
                <h1 class="card-title mb-4">
                    <i class="fas fa-boxes text-primary me-2"></i>
                    Sistema de Gestión de Productos
                </h1>
                <p class="lead mb-4">Selecciona una opción para continuar</p>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <a href="{{ url_for('alta') }}" class="btn btn-success btn-lg w-100">
                            <i class="fas fa-plus-circle me-2"></i>
                            Alta de Productos
                        </a>
                    </div>
                    <div class="col-md-6 mb-3">
                        <a href="{{ url_for('consulta') }}" class="btn btn-info btn-lg w-100">
                            <i class="fas fa-search me-2"></i>
                            Consulta / Modificación / Baja
                        </a>
                    </div>
                </div>

                <div class="mt-4">
                    <div class="row text-center">
                        <div class="col-md-4">
                            <i class="fas fa-plus text-success fa-2x mb-2"></i>
                            <h6>Crear nuevos productos</h6>
                        </div>
                        <div class="col-md-4">
                            <i class="fas fa-edit text-info fa-2x mb-2"></i>
                            <h6>Modificar productos existentes</h6>
                        </div>
                        <div class="col-md-4">
                            <i class="fas fa-trash text-danger fa-2x mb-2"></i>
                            <h6>Eliminar productos</h6>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
