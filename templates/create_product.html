{% extends 'base.html' %}
{% block title %}Alta de producto{% endblock %}
{% block content %}
  <h1 class="h4 mb-3">Alta de producto</h1>
  <form action="" method="post" enctype="multipart/form-data" class="row g-3">
    <div class="col-md-4">
      <label class="form-label">SKU</label>
      <input name="sku" class="form-control" required />
    </div>
    <div class="col-md-4">
      <label class="form-label">Imagen</label>
      <input type="file" name="image" accept="image/*" class="form-control" />
    </div>
    <div class="col-md-4">
      <label class="form-label">Cantidad</label>
      <input type="number" name="quantity" min="0" value="0" class="form-control" />
    </div>

    <div class="col-md-4">
      <label class="form-label">Estado</label>
      <select name="status" class="form-select">
        <option value="activo">Activo</option>
        <option value="inactivo">Inactivo</option>
        <option value="discontinuado">Discontinuado</option>
      </select>
    </div>
    <div class="col-md-4">
      <label class="form-label">Precio de Venta</label>
      <input type="number" step="0.01" name="sale_price" value="0" class="form-control" />
    </div>
    <div class="col-md-4">
      <label class="form-label">Categoría</label>
      <input name="category" class="form-control" />
    </div>

    <div class="col-md-12">
      <label class="form-label">Descripción</label>
      <textarea name="description" class="form-control" rows="3"></textarea>
    </div>

    <div class="col-md-6">
      <label class="form-label">Política de Gestión de Inventario</label>
      <input name="inventory_policy" class="form-control" placeholder="FIFO/LIFO/FEFO o personalizada" />
    </div>
    <div class="col-md-6">
      <label class="form-label">Proveedor</label>
      <input name="supplier" class="form-control" />
    </div>

    <div class="col-md-4">
      <label class="form-label">Costo Unitario</label>
      <input type="number" step="0.01" name="unit_cost" value="0" class="form-control" />
    </div>

    <div class="col-12 d-flex gap-2">
      <button class="btn btn-primary" type="submit">Crear</button>
      <a class="btn btn-secondary" href="{{ url_for('home') }}">Cancelar</a>
    </div>
  </form>
{% endblock %}
