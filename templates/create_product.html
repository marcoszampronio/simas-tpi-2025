{% extends 'base.html' %}
{% block title %}Alta de Producto{% endblock %}
{% block content %}
<h1>Alta de Producto</h1>
<form class="form" action="" method="post" enctype="multipart/form-data">
  <div class="form-row">
    <label>SKU</label>
    <input name="sku" required>
  </div>
  <div class="form-row">
    <label>Imagen</label>
    <input type="file" name="image" accept="image/*">
  </div>
  <div class="form-row">
    <label>Cantidad</label>
    <input type="number" name="quantity" value="0" min="0">
  </div>
  <div class="form-row">
    <label>Estado</label>
    <select name="status">
      <option value="activo">Activo</option>
      <option value="inactivo">Inactivo</option>
      <option value="agotado">Agotado</option>
    </select>
  </div>
  <div class="form-row">
    <label>Precio de Venta</label>
    <input type="number" step="0.01" name="sale_price" value="0">
  </div>
  <div class="form-row">
    <label>Categoría</label>
    <input name="category">
  </div>
  <div class="form-row">
    <label>Descripción</label>
    <textarea name="description" rows="3"></textarea>
  </div>
  <div class="form-row">
    <label>Política de Gestión de Inventario</label>
    <input name="inventory_policy" placeholder="FIFO / LIFO / FEFO / ...">
  </div>
  <div class="form-row">
    <label>Proveedor</label>
    <input name="supplier">
  </div>
  <div class="form-row">
    <label>Costo Unitario</label>
    <input type="number" step="0.01" name="unit_cost" value="0">
  </div>
  <div class="form-actions">
    <button type="submit" class="btn primary">Crear</button>
    <a class="btn" href="{{ url_for('index') }}">Cancelar</a>
  </div>
</form>
{% endblock %}
