{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-10">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title mb-0">
                    <i class="fas fa-plus-circle text-success me-2"></i>
                    Alta de Nuevo Producto
                </h3>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('crear_producto') }}" enctype="multipart/form-data">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="sku" class="form-label">
                                    <i class="fas fa-barcode me-1"></i>SKU Producto *
                                </label>
                                <input type="text" class="form-control" id="sku" name="sku" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="categoria" class="form-label">
                                    <i class="fas fa-tags me-1"></i>Categoría *
                                </label>
                                <select class="form-control" id="categoria" name="categoria" required>
                                    <option value="">Seleccionar categoría</option>
                                    <option value="Electrónica">Electrónica</option>
                                    <option value="Ropa">Ropa</option>
                                    <option value="Hogar">Hogar</option>
                                    <option value="Deportes">Deportes</option>
                                    <option value="Libros">Libros</option>
                                    <option value="Alimentos">Alimentos</option>
                                    <option value="Otros">Otros</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="cantidad" class="form-label">
                                    <i class="fas fa-cubes me-1"></i>Cantidad *
                                </label>
                                <input type="number" class="form-control" id="cantidad" name="cantidad" min="0" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="estado" class="form-label">
                                    <i class="fas fa-info-circle me-1"></i>Estado *
                                </label>
                                <select class="form-control" id="estado" name="estado" required>
                                    <option value="">Seleccionar estado</option>
                                    <option value="Disponible">Disponible</option>
                                    <option value="Agotado">Agotado</option>
                                    <option value="Descontinuado">Descontinuado</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="precio_venta" class="form-label">
                                    <i class="fas fa-dollar-sign me-1"></i>Precio de Venta *
                                </label>
                                <input type="number" step="0.01" class="form-control" id="precio_venta" name="precio_venta" min="0" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="costo_unitario" class="form-label">
                                    <i class="fas fa-coins me-1"></i>Costo Unitario
                                </label>
                                <input type="number" step="0.01" class="form-control" id="costo_unitario" name="costo_unitario" min="0">
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="proveedor" class="form-label">
                                    <i class="fas fa-truck me-1"></i>Proveedor
                                </label>
                                <input type="text" class="form-control" id="proveedor" name="proveedor">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="politica_inventario" class="form-label">
                                    <i class="fas fa-clipboard-list me-1"></i>Política de Gestión de Inventario
                                </label>
                                <select class="form-control" id="politica_inventario" name="politica_inventario">
                                    <option value="">Seleccionar política</option>
                                    <option value="Justo a Tiempo">Justo a Tiempo</option>
                                    <option value="Stock Permanente">Stock Permanente</option>
                                    <option value="Pedido Mínimo">Pedido Mínimo</option>
                                    <option value="Otros">Otros</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="descripcion" class="form-label">
                            <i class="fas fa-align-left me-1"></i>Descripción
                        </label>
                        <textarea class="form-control" id="descripcion" name="descripcion" rows="3"></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="imagen" class="form-label">
                            <i class="fas fa-image me-1"></i>Imagen del Producto
                        </label>
                        <input type="file" class="form-control" id="imagen" name="imagen" accept="image/*">
                        <div class="form-text">Formatos aceptados: PNG, JPG, JPEG, GIF</div>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{{ url_for('index') }}" class="btn btn-secondary me-md-2">
                            <i class="fas fa-arrow-left me-1"></i>Cancelar
                        </a>
                        <button type="submit" class="btn btn-success">
                            <i class="fas fa-save me-1"></i>Guardar Producto
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
