{% extends "base.html" %}

{% block title %}Editar Producto - CRUD Productos{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-header bg-warning text-dark">
                <h3 class="mb-0">
                    <i class="fas fa-edit"></i> Editar Producto: {{ producto.sku }}
                </h3>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('actualizar_producto', id=producto.id) }}">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="sku" class="form-label">
                                    <i class="fas fa-barcode"></i> SKU del Producto *
                                </label>
                                <input type="text" class="form-control" id="sku" name="sku" value="{{ producto.sku }}" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="categoria" class="form-label">
                                    <i class="fas fa-tags"></i> Categoría *
                                </label>
                                <select class="form-select" id="categoria" name="categoria" required>
                                    <option value="">Seleccionar categoría</option>
                                    <option value="Electrónicos" {{ 'selected' if producto.categoria == 'Electrónicos' }}>Electrónicos</option>
                                    <option value="Ropa" {{ 'selected' if producto.categoria == 'Ropa' }}>Ropa</option>
                                    <option value="Hogar" {{ 'selected' if producto.categoria == 'Hogar' }}>Hogar</option>
                                    <option value="Deportes" {{ 'selected' if producto.categoria == 'Deportes' }}>Deportes</option>
                                    <option value="Libros" {{ 'selected' if producto.categoria == 'Libros' }}>Libros</option>
                                    <option value="Otros" {{ 'selected' if producto.categoria == 'Otros' }}>Otros</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="cantidad" class="form-label">
                                    <i class="fas fa-cubes"></i> Cantidad *
                                </label>
                                <input type="number" class="form-control" id="cantidad" name="cantidad" min="0" value="{{ producto.cantidad }}" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="estado" class="form-label">
                                    <i class="fas fa-toggle-on"></i> Estado *
                                </label>
                                <select class="form-select" id="estado" name="estado" required>
                                    <option value="Activo" {{ 'selected' if producto.estado == 'Activo' }}>Activo</option>
                                    <option value="Inactivo" {{ 'selected' if producto.estado == 'Inactivo' }}>Inactivo</option>
                                    <option value="Descontinuado" {{ 'selected' if producto.estado == 'Descontinuado' }}>Descontinuado</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="precio_venta" class="form-label">
                                    <i class="fas fa-dollar-sign"></i> Precio de Venta *
                                </label>
                                <input type="number" class="form-control" id="precio_venta" name="precio_venta" step="0.01" min="0" value="{{ producto.precio_venta }}" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="costo_unitario" class="form-label">
                                    <i class="fas fa-coins"></i> Costo Unitario *
                                </label>
                                <input type="number" class="form-control" id="costo_unitario" name="costo_unitario" step="0.01" min="0" value="{{ producto.costo_unitario }}" required>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="imagen" class="form-label">
                            <i class="fas fa-image"></i> URL de Imagen
                        </label>
                        <input type="url" class="form-control" id="imagen" name="imagen" value="{{ producto.imagen or '' }}" placeholder="https://ejemplo.com/imagen.jpg">
                        {% if producto.imagen %}
                        <div class="mt-2">
                            <small class="text-muted">Vista previa actual:</small><br>
                            <img src="{{ producto.imagen }}" alt="Vista previa" class="img-thumbnail" style="max-width: 200px; max-height: 200px;">
                        </div>
                        {% endif %}
                    </div>

                    <div class="mb-3">
                        <label for="descripcion" class="form-label">
                            <i class="fas fa-align-left"></i> Descripción
                        </label>
                        <textarea class="form-control" id="descripcion" name="descripcion" rows="3" placeholder="Descripción detallada del producto">{{ producto.descripcion or '' }}</textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="politica_inventario" class="form-label">
                                    <i class="fas fa-clipboard-list"></i> Política de Gestión de Inventario
                                </label>
                                <select class="form-select" id="politica_inventario" name="politica_inventario">
                                    <option value="">Seleccionar política</option>
                                    <option value="FIFO" {{ 'selected' if producto.politica_inventario == 'FIFO' }}>FIFO (Primero en entrar, primero en salir)</option>
                                    <option value="LIFO" {{ 'selected' if producto.politica_inventario == 'LIFO' }}>LIFO (Último en entrar, primero en salir)</option>
                                    <option value="Promedio Ponderado" {{ 'selected' if producto.politica_inventario == 'Promedio Ponderado' }}>Promedio Ponderado</option>
                                    <option value="Específico" {{ 'selected' if producto.politica_inventario == 'Específico' }}>Identificación Específica</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="proveedor" class="form-label">
                                    <i class="fas fa-truck"></i> Proveedor
                                </label>
                                <input type="text" class="form-control" id="proveedor" name="proveedor" value="{{ producto.proveedor or '' }}" placeholder="Nombre del proveedor">
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">
                                    <i class="fas fa-calendar-plus"></i> Fecha de Creación
                                </label>
                                <input type="text" class="form-control" value="{{ producto.fecha_creacion.strftime('%d/%m/%Y %H:%M') }}" readonly>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">
                                    <i class="fas fa-calendar-edit"></i> Última Modificación
                                </label>
                                <input type="text" class="form-control" value="{{ producto.fecha_modificacion.strftime('%d/%m/%Y %H:%M') }}" readonly>
                            </div>
                        </div>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{{ url_for('consulta') }}" class="btn btn-secondary me-md-2">
                            <i class="fas fa-arrow-left"></i> Cancelar
                        </a>
                        <button type="submit" class="btn btn-warning">
                            <i class="fas fa-save"></i> Actualizar Producto
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
