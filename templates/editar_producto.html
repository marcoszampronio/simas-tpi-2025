{% extends "base.html" %}

{% block title %}Editar Producto - {{ producto.sku }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-10">
        <div class="card shadow">
            <div class="card-header bg-warning text-dark">
                <h3 class="mb-0">
                    <i class="fas fa-edit"></i> Editar Producto: {{ producto.sku }}
                </h3>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('editar_producto', id=producto.id) }}">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="sku" class="form-label">
                                    <i class="fas fa-barcode"></i> SKU del Producto *
                                </label>
                                <input type="text" class="form-control" id="sku" name="sku" value="{{ producto.sku }}" required>
                                <div class="form-text">Código único del producto</div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="imagen" class="form-label">
                                    <i class="fas fa-image"></i> URL de Imagen
                                </label>
                                <input type="url" class="form-control" id="imagen" name="imagen" value="{{ producto.imagen or '' }}" placeholder="https://ejemplo.com/imagen.jpg">
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4">
                            <div class="mb-3">
                                <label for="cantidad" class="form-label">
                                    <i class="fas fa-boxes"></i> Cantidad *
                                </label>
                                <input type="number" class="form-control" id="cantidad" name="cantidad" value="{{ producto.cantidad }}" min="0" required>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="mb-3">
                                <label for="estado" class="form-label">
                                    <i class="fas fa-toggle-on"></i> Estado *
                                </label>
                                <select class="form-select" id="estado" name="estado" required>
                                    <option value="Activo" {{ 'selected' if producto.estado == 'Activo' else '' }}>Activo</option>
                                    <option value="Inactivo" {{ 'selected' if producto.estado == 'Inactivo' else '' }}>Inactivo</option>
                                    <option value="Descontinuado" {{ 'selected' if producto.estado == 'Descontinuado' else '' }}>Descontinuado</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="mb-3">
                                <label for="categoria" class="form-label">
                                    <i class="fas fa-tags"></i> Categoría *
                                </label>
                                <input type="text" class="form-control" id="categoria" name="categoria" value="{{ producto.categoria }}" required>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="precio_venta" class="form-label">
                                    <i class="fas fa-dollar-sign"></i> Precio de Venta *
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="number" class="form-control" id="precio_venta" name="precio_venta" value="{{ producto.precio_venta }}" step="0.01" min="0" required>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="costo_unitario" class="form-label">
                                    <i class="fas fa-calculator"></i> Costo Unitario *
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="number" class="form-control" id="costo_unitario" name="costo_unitario" value="{{ producto.costo_unitario }}" step="0.01" min="0" required>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="proveedor" class="form-label">
                                    <i class="fas fa-truck"></i> Proveedor *
                                </label>
                                <input type="text" class="form-control" id="proveedor" name="proveedor" value="{{ producto.proveedor }}" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="politica_gestion_inventario" class="form-label">
                                    <i class="fas fa-clipboard-list"></i> Política de Gestión de Inventario
                                </label>
                                <select class="form-select" id="politica_gestion_inventario" name="politica_gestion_inventario">
                                    <option value="">Seleccionar...</option>
                                    <option value="FIFO" {{ 'selected' if producto.politica_gestion_inventario == 'FIFO' else '' }}>FIFO (First In, First Out)</option>
                                    <option value="LIFO" {{ 'selected' if producto.politica_gestion_inventario == 'LIFO' else '' }}>LIFO (Last In, First Out)</option>
                                    <option value="PROMEDIO" {{ 'selected' if producto.politica_gestion_inventario == 'PROMEDIO' else '' }}>PROMEDIO</option>
                                    <option value="ESPECIFICO" {{ 'selected' if producto.politica_gestion_inventario == 'ESPECÍFICO' else '' }}>ESPECÍFICO</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="descripcion" class="form-label">
                            <i class="fas fa-align-left"></i> Descripción
                        </label>
                        <textarea class="form-control" id="descripcion" name="descripcion" rows="4" placeholder="Descripción detallada del producto...">{{ producto.descripcion or '' }}</textarea>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{{ url_for('detalle_producto', id=producto.id) }}" class="btn btn-secondary me-md-2">
                            <i class="fas fa-times"></i> Cancelar
                        </a>
                        <button type="submit" class="btn btn-warning">
                            <i class="fas fa-save"></i> Actualizar Producto
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
