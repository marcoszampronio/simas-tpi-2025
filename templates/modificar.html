{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-12">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{{ url_for('index') }}">Inicio</a></li>
                <li class="breadcrumb-item"><a href="{{ url_for('consulta') }}">Consulta</a></li>
                <li class="breadcrumb-item active">Modificar Producto</li>
            </ol>
        </nav>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-lg-10">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title mb-0">
                    <i class="fas fa-edit text-warning me-2"></i>
                    Modificar Producto: {{ producto.sku }}
                </h3>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('modificar_producto', id=producto.id) }}" enctype="multipart/form-data">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="sku" class="form-label">
                                    <i class="fas fa-barcode me-1"></i>SKU Producto *
                                </label>
                                <input type="text" class="form-control" id="sku" name="sku" value="{{ producto.sku }}" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="categoria" class="form-label">
                                    <i class="fas fa-tags me-1"></i>Categoría *
                                </label>
                                <select class="form-control" id="categoria" name="categoria" required>
                                    <option value="">Seleccionar categoría</option>
                                    <option value="Electrónica" {{ 'selected' if producto.categoria == 'Electrónica' else '' }}>Electrónica</option>
                                    <option value="Ropa" {{ 'selected' if producto.categoria == 'Ropa' else '' }}>Ropa</option>
                                    <option value="Hogar" {{ 'selected' if producto.categoria == 'Hogar' else '' }}>Hogar</option>
                                    <option value="Deportes" {{ 'selected' if producto.categoria == 'Deportes' else '' }}>Deportes</option>
                                    <option value="Libros" {{ 'selected' if producto.categoria == 'Libros' else '' }}>Libros</option>
                                    <option value="Alimentos" {{ 'selected' if producto.categoria == 'Alimentos' else '' }}>Alimentos</option>
                                    <option value="Otros" {{ 'selected' if producto.categoria == 'Otros' else '' }}>Otros</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="cantidad" class="form-label">
                                    <i class="fas fa-cubes me-1"></i>Cantidad *
                                </label>
                                <input type="number" class="form-control" id="cantidad" name="cantidad" min="0" value="{{ producto.cantidad }}" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="estado" class="form-label">
                                    <i class="fas fa-info-circle me-1"></i>Estado *
                                </label>
                                <select class="form-control" id="estado" name="estado" required>
                                    <option value="">Seleccionar estado</option>
                                    <option value="Disponible" {{ 'selected' if producto.estado == 'Disponible' else '' }}>Disponible</option>
                                    <option value="Agotado" {{ 'selected' if producto.estado == 'Agotado' else '' }}>Agotado</option>
                                    <option value="Descontinuado" {{ 'selected' if producto.estado == 'Descontinuado' else '' }}>Descontinuado</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="precio_venta" class="form-label">
                                    <i class="fas fa-dollar-sign me-1"></i>Precio de Venta *
                                </label>
                                <input type="number" step="0.01" class="form-control" id="precio_venta" name="precio_venta" min="0" value="{{ producto.precio_venta }}" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="costo_unitario" class="form-label">
                                    <i class="fas fa-coins me-1"></i>Costo Unitario
                                </label>
                                <input type="number" step="0.01" class="form-control" id="costo_unitario" name="costo_unitario" min="0" value="{{ producto.costo_unitario or '' }}">
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="proveedor" class="form-label">
                                    <i class="fas fa-truck me-1"></i>Proveedor
                                </label>
                                <input type="text" class="form-control" id="proveedor" name="proveedor" value="{{ producto.proveedor or '' }}">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="politica_inventario" class="form-label">
                                    <i class="fas fa-clipboard-list me-1"></i>Política de Gestión de Inventario
                                </label>
                                <select class="form-control" id="politica_inventario" name="politica_inventario">
                                    <option value="">Seleccionar política</option>
                                    <option value="Justo a Tiempo" {{ 'selected' if producto.politica_inventario == 'Justo a Tiempo' else '' }}>Justo a Tiempo</option>
                                    <option value="Stock Permanente" {{ 'selected' if producto.politica_inventario == 'Stock Permanente' else '' }}>Stock Permanente</option>
                                    <option value="Pedido Mínimo" {{ 'selected' if producto.politica_inventario == 'Pedido Mínimo' else '' }}>Pedido Mínimo</option>
                                    <option value="Otros" {{ 'selected' if producto.politica_inventario == 'Otros' else '' }}>Otros</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="descripcion" class="form-label">
                            <i class="fas fa-align-left me-1"></i>Descripción
                        </label>
                        <textarea class="form-control" id="descripcion" name="descripcion" rows="3">{{ producto.descripcion or '' }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label for="imagen" class="form-label">
                            <i class="fas fa-image me-1"></i>Imagen del Producto
                        </label>
                        {% if producto.imagen %}
                            <div class="mb-2">
                                <img src="{{ url_for('static', filename='uploads/' + producto.imagen) }}" alt="Imagen actual" class="img-thumbnail" style="max-width: 100px;">
                                <small class="text-muted d-block">Imagen actual</small>
                            </div>
                        {% endif %}
                        <input type="file" class="form-control" id="imagen" name="imagen" accept="image/*">
                        <div class="form-text">Formatos aceptados: PNG, JPG, JPEG, GIF. Deja vacío para mantener la imagen actual.</div>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{{ url_for('consulta') }}" class="btn btn-secondary me-md-2">
                            <i class="fas fa-arrow-left me-1"></i>Cancelar
                        </a>
                        <button type="submit" class="btn btn-success">
                            <i class="fas fa-save me-1"></i>Actualizar Producto
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
